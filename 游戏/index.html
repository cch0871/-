const BIG=["斗之气","斗者","斗师","大斗师","斗灵","斗王","斗皇","斗宗","斗尊","斗圣","斗帝"],NUM=["一","二","三","四","五","六","七","八","九"];
function realmName(i){i=Math.max(0,Math.min(98,i));const b=Math.floor(i/9),s=i%9;if(b>=BIG.length)return"斗帝";if(BIG[b]==="斗之气")return"斗之气"+NUM[s]+"段";if(BIG[b]==="斗帝")return"斗帝";return BIG[b]+NUM[s]+"星"}

const state={day:1,exp:240,gold:200,hp:100,rel:{xuner:0,xiaoyixian:0,medusa:0,yunyun:0,nalan:0,yafei:0},flags:{},items:{},history:[],achievements:{},auction:[],nodeId:"start",dead:false,pendingNext:null,lastDelta:"",sound:true};
const SFX=(()=>{let c=null;function init(){if(!c){try{c=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}}if(c.state==="suspended")c.resume()}function tone(f,d,t="sine",v=.08,delay=0){if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=t;o.frequency.value=f;g.gain.value=0;o.connect(g);g.connect(c.destination);const s=c.currentTime+delay;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+.01);g.gain.exponentialRampToValueAtTime(.001,s+d);o.start(s);o.stop(s+d+.05)}return{init,click(){if(!state.sound)return;init();tone(620,.05,"square",.03)},levelup(){if(!state.sound)return;init();[523,659,784,1047].forEach((f,i)=>tone(f,.14,"sine",.07,i*.08))},achievement(){if(!state.sound)return;init();[784,988,1175].forEach((f,i)=>tone(f,.18,"triangle",.07,i*.1))},success(){if(!state.sound)return;init();tone(880,.12,"sine",.05);tone(1175,.18,"sine",.045,.09)},fail(){if(!state.sound)return;init();tone(220,.28,"sawtooth",.05)},death(){if(!state.sound)return;init();[440,330,220,110].forEach((f,i)=>tone(f,.38,"sawtooth",.06,i*.14))},gold(){if(!state.sound)return;init();[1047,1319].forEach((f,i)=>tone(f,.09,"triangle",.05,i*.06))}}})();
const ITEM_DEF={"聚气散":{desc:"+80修为",effect:{exp:80},sell:40},"筑基灵液":{desc:"+200修为",effect:{exp:200},sell:90},"疗伤丹":{desc:"+30气血",effect:{hp:30},sell:30},"复伤丹":{desc:"+60气血",effect:{hp:60},sell:65},"三纹青灵丹":{desc:"+500修为",effect:{exp:500},sell:230},"破宗丹":{desc:"+1200修为",effect:{exp:1200},sell:560,flag:{broke:true}},"青莲地心火·种":{desc:"异火种子，+300修为",effect:{exp:300},sell:900,flag:{fire_seed:true}},"陨落心炎·种":{desc:"异火种子，+400修为",effect:{exp:400},sell:1100,flag:{fire_seed:true}},"裂风掌":{desc:"+60修为",effect:{exp:60},sell:70},"吸掌·残卷":{desc:"+120修为",effect:{exp:120},sell:140}};

const PORTRAIT_MAP={start:"xiao",front_hall:"nalan",three_year_vow:"yao",calm_break:"nalan",wake_yao:"yao",yao_master:"yao",family_test:"xiao",canaan:"canaan",monster_mountain:"xiao",save_girl:"xiaoyixian",xiaoyixian_route:"xiaoyixian",snake_tribe:"medusa",three_year_duel:"nalan",yun_yun:"yunyun",nalan_after:"nalan",zhongzhou:"xiao",zhongzhou_hub:"xiao",dan_tower:"dan",huazong_1:"yunyun",huazong_2:"yunyun",huazong_3:"yunyun",medusa_route:"medusa",soul_hall:"soul",final_battle:"soul",auction_house:"auction",auction_lose:"auction",sell_items:"auction",ending_emperor:"xiao",ending_medusa:"medusa",ending_healer:"xiaoyixian",ending_gu:"xuner",ending_alchemist:"dan",dead_end:"soul",ev_qi_deviation:"xiao",ev_bandit:"xiao",ev_bandit_fail:"xiao",ev_cave:"xiao",ev_cave_fail:"xiao",ev_insight:"xiao",ev_meet_xuner:"xuner",ev_meet_xiaoyixian:"xiaoyixian"};
const ACHIEVEMENTS=[{id:"a1",name:"初入此界",desc:"做出第一个选择",check:s=>s.history.length>=1},{id:"a2",name:"斗者",desc:"达到斗者",check:s=>Math.floor(s.exp/120)>=9},{id:"a3",name:"斗师",desc:"达到斗师",check:s=>Math.floor(s.exp/120)>=18},{id:"a4",name:"斗王",desc:"达到斗王",check:s=>Math.floor(s.exp/120)>=45},{id:"a5",name:"斗皇",desc:"达到斗皇",check:s=>Math.floor(s.exp/120)>=54},{id:"a6",name:"斗宗",desc:"达到斗宗",check:s=>Math.floor(s.exp/120)>=63},{id:"a7",name:"斗帝",desc:"达到斗帝",check:s=>Math.floor(s.exp/120)>=98},{id:"a8",name:"炼药师",desc:"获得炼药师身份",check:s=>s.flags.alchemist},{id:"a9",name:"异火",desc:"得到异火种子",check:s=>s.flags.fire_seed||s.flags.heart_fire},{id:"a10",name:"富甲一方",desc:"金币达到1000",check:s=>s.gold>=1000},{id:"a11",name:"薰儿之心",desc:"薰儿好感30",check:s=>s.rel.xuner>=30},{id:"a12",name:"医仙之谊",desc:"小医仙好感30",check:s=>s.rel.xiaoyixian>=30},{id:"a13",name:"女王之盟",desc:"美杜莎好感30",check:s=>s.rel.medusa>=30},{id:"a14",name:"云韵之信",desc:"云韵好感30",check:s=>s.rel.yunyun>=30},{id:"a15",name:"花宗盟友",desc:"与花宗结盟",check:s=>s.flags.huazong_ally},{id:"a16",name:"古族姑爷",desc:"获得古族认可",check:s=>s.flags.gu_ally},{id:"a17",name:"收藏家",desc:"持有5种物品",check:s=>Object.keys(s.items).length>=5},{id:"a18",name:"第一次死亡",desc:"身死道消",check:s=>s.dead},{id:"a19",name:"炎帝",desc:"达成炎帝结局",check:s=>s.nodeId==="ending_emperor"},{id:"a20",name:"多情",desc:"3位女主好感20",check:s=>Object.values(s.rel).filter(v=>v>=20).length>=3}];
function checkAchievements(){const u=[];ACHIEVEMENTS.forEach(a=>{if(state.achievements[a.id])return;if(a.check(state)){state.achievements[a.id]=true;u.push(a)}});if(u.length){SFX.achievement();u.forEach(a=>toast("🏆 成就解锁："+a.name))}return u}
const AUCTION_POOL=[{name:"聚气散",base:80},{name:"筑基灵液",base:180},{name:"疗伤丹",base:60},{name:"复伤丹",base:130},{name:"三纹青灵丹",base:450},{name:"破宗丹",base:1100},{name:"裂风掌",base:140},{name:"吸掌·残卷",base:280},{name:"青莲地心火·种",base:1800},{name:"陨落心炎·种",base:2200}];
function refreshAuction(){const p=[...AUCTION_POOL],o=[];for(let i=0;i<3&&p.length;i++){const idx=Math.floor(Math.random()*p.length),it=p.splice(idx,1)[0];o.push({name:it.name,price:Math.round(it.base*(.85+Math.random()*.3))})}state.auction=o}
function applyFx(fx){const d=[];if(!fx)return d;if(fx.exp){state.exp+=fx.exp;d.push("修为 +"+fx.exp)}if(fx.gold){state.gold+=fx.gold;d.push("金币 "+(fx.gold>0?"+":"")+fx.gold)}if(fx.hp){state.hp+=fx.hp;d.push("气血 "+(fx.hp>0?"+":"")+fx.hp)}if(fx.day){state.day+=fx.day;d.push("时间 +"+fx.day+"天")}if(fx.rel){for(const k in fx.rel){state.rel[k]=(state.rel[k]||0)+fx.rel[k];d.push("好感·"+relName(k)+" "+(fx.rel[k]>0?"+":"")+fx.rel[k])}}if(fx.item){const arr=Array.isArray(fx.item)?fx.item:[fx.item];arr.forEach(it=>{state.items[it]=(state.items[it]||0)+1;d.push("获得【"+it+"】")})}if(fx.flag){for(const k in fx.flag)state.flags[k]=fx.flag[k]}if(state.hp>100)state.hp=100;if(state.gold<0)state.gold=0;return d}
function toast(m){const t=document.createElement("div");t.textContent=m;t.style.cssText="position:fixed;left:50%;bottom:60px;transform:translateX(-50%);background:#3a2c1e;color:#e8dcc8;padding:8px 16px;border-radius:20px;font-size:13px;z-index:99;opacity:.96;max-width:80%;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.5)";document.body.appendChild(t);setTimeout(()=>t.remove(),1700)}
function calcEnding(){const r=state.rel;if(state.flags.medusa_ally&&r.medusa>=30)return"ending_medusa";if(r.xiaoyixian>=30)return"ending_healer";if(r.xuner>=30)return"ending_gu";if(state.flags.alchemist&&state.gold>=800)return"ending_alchemist";return"ending_emperor"}
const EVENT_POOL=["ev_qi_deviation","ev_bandit","ev_cave","ev_insight","ev_meet_xuner","ev_meet_xiaoyixian"];
function pickEvent(){return EVENT_POOL[Math.floor(Math.random()*EVENT_POOL.length)]}
const N={
start:{title:"序章 · 醒来",text:`剧烈的头痛像钝锤在颅骨内侧来回敲打。\n\n你猛地睁眼——土黄的天花板、粗糙的木梁、空气里药草的苦味混着汗酸。你低头，看见一双稚嫩的手，指节上带着练功磨出的薄茧。\n\n两股记忆在打架：一股属于你，一个熬夜翻《斗破苍穹》的普通人；另一股属于“萧炎”，乌坦城萧家三少爷，曾被誉为百年天才，十二岁后斗之气倒退，沦为全族笑柄。\n\n桌上摊着一本泛黄书册，封面写着四个字：《斗破苍穹》。剧情完整，连异火排名都清清楚楚。\n\n今天是萧炎十五岁零三个月。门外传来萧战的声音：“三少爷，云岚宗来人了。”\n\n比原著提前了两天。蝴蝶效应，已经开始了。`,choices:[{text:"A. 压住心绪，按原著节奏去前厅。",hint:"最安全，贴合剧本",tag:"safe",next:"front_hall",fx:{day:1}},{text:"B. 先去后山，试着主动唤醒戒指里的药老。",hint:"可能提前拿到机缘",next:"wake_yao",fx:{day:1}},{text:"C. 称病不去，趁乱去藏书阁找功法。",hint:"收益有限，可能被长老撞见",next:"library",fx:{day:1}}]},
front_hall:{title:"第一幕 · 退婚",text:`你整理衣襟走向前厅。萧战看见你，眼神复杂：“炎儿，云岚宗少宗主纳兰嫣然来了，说……要谈当年婚约。”\n\n厅中站着一名白衣少女，眉眼清冷，身后两名云岚宗弟子抱剑而立。她目光扫过你，几乎没有停留。\n\n“萧炎少爷，”纳兰嫣然开口，“我今日来，是想解除婚约。”\n\n厅里安静得能听见烛火噼啪。萧战的指节攥得发白。`,choices:[{text:"按原著：暴怒、写休书、立三年之约。",hint:"受辱，但会触发药老苏醒",tag:"safe",next:"three_year_vow"},{text:"冷静同意退婚，但不写休书。",hint:"避免羞辱，但可能错过药老苏醒",next:"calm_break"}]},
three_year_vow:{title:"三年之约",text:`你咬破手指，在纸上写下休书：“纳兰嫣然，今日你退婚，我萧炎接着。三年之后，我上云岚宗，亲自讨回今日之辱！”\n\n纳兰嫣然脸色微变，最终冷笑：“好，我等你三年。”\n\n当夜，你回到房中。指间那枚黑色古戒忽然一热，一道苍老而虚弱的声音在脑海里响起：“小娃娃……脾气不小。不过，老夫喜欢。”`,choices:[{text:"当即拜师，请药老传功。",tag:"safe",next:"yao_master",fx:{day:2,flag:{yao_master:true}}},{text:"先问一句：你为何选中我？",next:"yao_why"}]},
yao_why:{title:"为何是我",text:`“前辈为何选中我？”\n\n药老的声音带着几分疲惫：“老夫沉睡在这戒指里不知多少年，路过的、捡到的、戴上的，不止你一个。可只有你，灵魂里带着一股不属于这方天地的气息。”\n\n他顿了顿：“老夫不知道那是福是祸。但老夫现在没得选。”`,choices:[{text:"不再多问，拜师。",tag:"safe",next:"yao_master",fx:{flag:{yao_master:true}}}]},
calm_break:{title:"体面退场",text:`你平静点头：“婚约可退。但纳兰小姐，今日之事，萧家记下了。”\n\n纳兰嫣然沉默片刻，留下一瓶聚气散：“算是补偿。”她带人离去。\n\n你拿起玉瓶，指间古戒却毫无反应——没有那场羞辱带来的剧烈情绪波动，药老仍在沉睡。`,choices:[{text:"立刻服用聚气散。",next:"take_powder",fx:{day:2,item:"聚气散"}},{text:"去后山，试着唤醒戒指。",next:"wake_yao",fx:{day:1}}]},
take_powder:{title:"聚气散",text:`你服下聚气散，一股温热的气流从丹田升起。半日后，斗之气稳固在四段巅峰。但药老依旧沉睡，戒指冰凉。\n\n你隐隐觉得，错过了一次更重要的机缘。`,choices:[{text:"去后山，用情绪波动试着唤醒戒指。",next:"wake_yao",fx:{day:3,exp:120}}]},
wake_yao:{title:"后山古戒",text:`你绕到后山，从怀里摸出那枚黑色古戒。戒指冰凉，纹路古朴。\n\n你试着注入斗之气，毫无反应。又低声喊：“药老？药尘？”\n\n戒指微微一热。一道苍老而虚弱的声音在脑海里响起：“……小娃娃，你怎知老夫名讳？”\n\n药老提前苏醒了。但你能感觉到，他的灵魂力量极不稳定。`,choices:[{text:"如实说：我来自另一个世界。",hint:"坦白可能换来信任，也可能被当成夺舍邪修",tag:"danger",risk:.3,failNext:"yao_lie",next:"yao_truth"},{text:"编造：偶然得到残卷。",next:"yao_lie"},{text:"不解释，只求他教你炼药和修炼。",next:"yao_teach"}]},
yao_truth:{title:"坦诚",text:`你把穿越、剧本、原著剧情全说了。药老沉默了很久。\n\n“另一个世界……剧本……”他声音低沉，“小娃娃，你若真知道未来，那老夫问你：我徒弟韩枫，现在何处？”\n\n你答得出。药老信了七分，但也更警惕：“你知道得太多，未必是好事。”`,choices:[{text:"答应，拜师。",tag:"safe",next:"yao_master",fx:{flag:{yao_master:true}}}]},
yao_lie:{title:"半信半疑",text:`你说是偶然得到残卷。药老“嗯”了一声，没再追问，但你能感觉到他的灵魂感知在你身上扫了两遍。\n\n“也罢。老夫灵魂虚弱，需要你帮忙寻找恢复之物。你助我，我教你炼药。”`,choices:[{text:"拜师，开始修炼。",tag:"safe",next:"yao_master",fx:{flag:{yao_master:true}}}]},
yao_teach:{title:"只求修炼",text:`你没有解释来历，只躬身一礼：“晚辈只想变强。前辈若肯教，晚辈愿以性命相托。”\n\n药老沉默片刻，忽然笑了：“心性不错。老夫教你，但记住——炼药一途，急不得；修炼一途，更急不得。”`,choices:[{text:"从焚诀开始。",tag:"safe",next:"yao_master",fx:{flag:{yao_master:true}}}]},
yao_master:{title:"焚诀初成",text:`药老传你焚诀第一层。你盘膝而坐，斗之气在经脉中缓慢运转。\n\n三日后，你突破至斗之气四段。药老警告：“焚诀需吞噬异火才能进化，在此之前，它只是黄阶功法。你要变强，就得去寻异火。”`,choices:[{text:"留在乌坦城，参加家族测验。",tag:"safe",next:"family_test",fx:{day:30,exp:180}},{text:"动身去魔兽山脉，寻找异火线索。",tag:"danger",next:"monster_mountain",fx:{day:20,exp:120}}]},
library:{title:"藏书阁",text:`你称病留在房中，等前厅热闹起来，悄悄摸向藏书阁。\n\n看守的是二长老萧鹰，斗师修为。你远远看见他在门口打瞌睡。一楼是黄阶功法，二楼据说有玄阶残卷。`,choices:[{text:"只在一楼找黄阶高级功法。",next:"library_low",fx:{day:1}},{text:"冒险上二楼找玄阶残卷。",tag:"danger",risk:.5,failNext:"library",failFx:{hp:-20},next:"library_high"},{text:"放弃，回去前厅。",tag:"safe",next:"front_hall"}]},
library_low:{title:"黄阶高级",text:`你在一楼角落翻到一卷《裂风掌》，黄阶高级。虽然不算什么好东西，但聊胜于无。`,choices:[{text:"回房修炼。",next:"family_test",fx:{day:20,exp:150,item:"裂风掌"}}]},
library_high:{title:"二楼残卷",text:`你屏住呼吸上了二楼。在最里层的木匣里，找到半卷玄阶低级斗技——《吸掌》。\n\n刚塞进怀里，楼下传来萧鹰的咳嗽声。你贴着墙根溜下去，心脏几乎跳出喉咙。`,choices:[{text:"回房修炼。",next:"family_test",fx:{day:15,exp:220,item:"吸掌·残卷",hp:-10}}]},
family_test:{title:"家族测验",text:`萧家家族测验开始。你以斗之气四段出场，族中一片惊讶。萧战露出久违的笑。\n\n但也有人低声说：“才四段，还是废物。”\n\n你没有辩解。药老在戒指里淡淡道：“嘴长在别人身上，修为长在你自己身上。”`,choices:[{text:"低调修炼，等迦南学院招生。",tag:"safe",next:"canaan",fx:{day:180,exp:400}},{text:"主动申请去魔兽山脉历练。",tag:"danger",next:"monster_mountain",fx:{day:60,exp:250}}]},
canaan:{title:"迦南学院",text:`数月后，迦南学院招生。你以斗者修为通过初试，坐上前往学院的马车。\n\n车窗外，乌坦城的轮廓越来越小。药老在你脑海里说：“迦南学院里有异火的消息。但那里水很深，别急着出头。”`,choices:[{text:"在学院低调修炼。",tag:"safe",next:"canaan_low",fx:{day:120,exp:500}},{text:"主动接近萧薰儿。",next:"xuner",fx:{day:30,exp:150}}]},
canaan_low:{title:"外院岁月",text:`你在外院低调修炼，偶尔帮同学炼些低阶丹药换资源。日子平淡，但修为稳步上涨。\n\n半年后，你突破至斗师。药老评价：“不快，但稳。稳比快好。”`,choices:[{text:"参加内院选拔。",next:"inner_academy",fx:{day:60,exp:400}}]},
xuner:{title:"薰儿",text:`你在藏书楼“偶遇”萧薰儿。她穿着淡青长裙，看见你时眼睛亮了一下：“萧炎哥哥。”\n\n你们聊了很久。她没有问你为什么突然变了一个人，只是说：“不管你变成什么样，我都认得你。”\n\n药老在戒指里啧啧两声：“这丫头背景不简单。你小子运气不错，但别把她当靠山。”`,choices:[{text:"继续修炼，准备内院选拔。",next:"inner_academy",fx:{day:60,exp:350,rel:{xuner:15}}}]},
inner_academy:{title:"内院",text:`内院选拔，你以斗师三星的实力挤进名单。内院比外院残酷得多，强者为尊。\n\n药老提醒：“内院地底有陨落心炎的封印。想拿，就得冒险。”`,choices:[{text:"冒险潜入地底，争夺陨落心炎。",tag:"danger",risk:.45,failNext:"inner_academy",failFx:{hp:-45},next:"heart_fire"},{text:"不冒险，直接去云岚宗赴三年之约。",next:"three_year_duel"}]},
heart_fire:{title:"陨落心炎",text:`地底岩浆翻涌，陨落心炎像一条火龙盘踞在封印深处。你咬破舌尖，催动焚诀，硬生生把它往体内拽。\n\n剧痛从五脏六腑炸开。药老低喝：“稳住！”\n\n不知过了多久，你睁开眼，瞳孔里掠过一抹赤红。焚诀进化，修为直接冲到斗师巅峰。`,choices:[{text:"出关，赴三年之约。",next:"three_year_duel",fx:{day:90,exp:1200,item:"陨落心炎·种",hp:-20,flag:{heart_fire:true}}}]},
monster_mountain:{title:"魔兽山脉",text:`你进入魔兽山脉外围。古木参天，空气里带着腐叶和兽血的味道。\n\n药老提醒：“以你现在的修为，只能在外围活动。深处有斗师级魔兽，遇上就是死。”\n\n前方忽然传来打斗声。你拨开灌木，看见一名紫衣少女被一头二阶魔兽逼到崖边。`,choices:[{text:"出手救人。",hint:"硬拼有生命危险",tag:"danger",risk:.3,failNext:"dead_end",next:"save_girl",fx:{exp:80}},{text:"绕开，保命要紧。",next:"avoid_girl",fx:{exp:30}}]},
save_girl:{title:"小医仙",text:`你冲出去引开魔兽，药老在戒指里暗中出手，一道灵魂波动震退魔兽。\n\n紫衣少女回头看你，喘着气：“多谢。我叫小医仙。”\n\n她懂医术，随身带着不少草药。你们结伴走出山谷。`,choices:[{text:"与她同行，探索山谷深处。",next:"xiaoyixian_route",fx:{rel:{xiaoyixian:15}}}]},
avoid_girl:{title:"独行",text:`你绕开战场，独自往山脉深处走。身后传来一声短促的惊呼，然后归于寂静。\n\n你没有回头。药老沉默了一会儿，说：“修行路上，这种选择以后还有很多。”`,choices:[{text:"转向蛇人族领地。",next:"snake_tribe",fx:{day:15,exp:100}}]},
xiaoyixian_route:{title:"山谷同行",text:`你和小医仙在山谷里走了七天。她采药，你守夜；她治伤，你找吃的。\n\n临别时，她塞给你一只药囊：“里面有我配的解毒散和止血膏。你……小心点。”\n\n药老在戒指里说：“这丫头体质特殊，是厄难毒体。跟着她，要么大机缘，要么大麻烦。”`,choices:[{text:"带她一起去洞穴找异火线索。",next:"cave_fire",fx:{day:10,exp:150,rel:{xiaoyixian:10},item:"疗伤丹"}}]},
cave_fire:{title:"洞穴深处",text:`洞穴很深，岩壁上泛着淡淡的青光。你们走到尽头，看见一池翻滚的岩浆，岩浆中央，一朵青莲静静绽放。\n\n“青莲地心火。”药老的声音罕见地发紧，“好东西。但以你现在的修为，碰它就是死。”\n\n小医仙拉住你的袖子：“别去。”`,choices:[{text:"强行夺取青莲地心火。",tag:"danger",risk:.75,failNext:"dead_end",next:"heart_fire",fx:{exp:400}},{text:"记下位置，先离开。",tag:"safe",next:"snake_tribe",fx:{day:5,exp:120,flag:{qinglian_mark:true}}}]},
snake_tribe:{title:"蛇人族",text:`你误入蛇人族领地，被几名蛇人战士围住。她们没有立刻动手，而是把你押到一座石殿前。\n\n殿中王座上，一名紫发女子缓缓抬眼。她的目光像刀，扫过你时，你后背瞬间被冷汗浸透。\n\n“人类，”美杜莎女王开口，“你闯我族地，想怎么死？”`,choices:[{text:"坦白来意，说自己是来找异火线索的。",tag:"danger",risk:.4,failNext:"dead_end",next:"canaan",fx:{rel:{medusa:10},exp:150,flag:{medusa_met:true}}},{text:"跪地求饶，献上丹药。",next:"canaan",fx:{gold:-150,exp:50}},{text:"转身就跑。",tag:"danger",risk:.9,failNext:"dead_end",next:"canaan"}]},
three_year_duel:{title:"三年之约",text:`三年之期已到。你站在云岚宗山门前，身后是看热闹的各方势力。\n\n纳兰嫣然一身白衣，从石阶上走下来。她比三年前更冷，也更沉。看见你时，她脚步顿了一下。\n\n“你来了。”\n\n“我来了。”`,choices:[{text:"全力出手，正面击败纳兰嫣然。",tag:"danger",risk:.35,failNext:"duel_fail",next:"nalan_after",fx:{exp:600}},{text:"留手，点到为止。",next:"yun_yun",fx:{exp:300,rel:{nalan:10}}},{text:"以异火压制，速战速决。",tag:"danger",risk:.15,failNext:"duel_fail",next:"nalan_after",fx:{exp:700,flag:{reveal_fire:true}}}]},
duel_fail:{title:"败",text:`你败了。纳兰嫣然的剑停在你咽喉前三寸，没有刺下去。\n\n“你进步很大，”她说，“但还是不够。”\n\n你躺在石阶上，胸口像压了一块石头。药老在戒指里低声说：“输一场不算什么。怕的是输完就站不起来。”`,choices:[{text:"养伤，然后继续。",next:"yun_yun",fx:{hp:-40,day:30,exp:300}}]},
yun_yun:{title:"云韵",text:`比试结束后，云岚宗宗主云韵在偏殿见了你。\n\n她比传闻中年轻，眉眼间带着一种说不出的倦意。“你身上有异火的气息。”她看着你，“还有……药尘的味道。”\n\n你没有否认。她沉默很久，最后只说了一句：“别把云岚宗逼到绝路。”`,choices:[{text:"与她多聊几句，探听魂殿的消息。",next:"nalan_after",fx:{rel:{yunyun:15},exp:100,day:5}},{text:"告辞离开。",next:"nalan_after",fx:{day:2}}]},
nalan_after:{title:"山门之外",text:`你走下云岚宗石阶。纳兰嫣然站在山门口，没有拦你。\n\n“萧炎。”她叫住你，“下次见面，我不会再留手。”\n\n你笑了笑：“彼此彼此。”\n\n药老在戒指里说：“该去中州了。那里才有让你真正变强的东西。”`,choices:[{text:"动身前往中州。",next:"zhongzhou",fx:{day:60,exp:500}}]},
zhongzhou:{title:"中州",text:`中州，斗气大陆的中心。强者如云，斗皇多如狗，斗宗满地走。\n\n你在这里第一次见到真正的顶级势力：丹塔、魂殿、花宗、天冥宗、古族……每一家都能随手碾死现在的你。\n\n药老的声音沉下来：“接下来的路，我帮不了你太多了。去哪，你自己选。”`,choices:[{text:"进城，打探消息。",next:"zhongzhou_hub",fx:{day:15,exp:100}}]},
zhongzhou_hub:{title:"中州 · 枢纽",text:`你在中州落脚，租了一间不起眼的客栈。窗外人声鼎沸，修士往来如织。\n\n你可以选择接下来要走的路。每一条都有代价，也有回报。`,choices:[{text:"前往丹塔，参加炼药师考核。",hideIf:"visited_danta",next:"dan_tower"},{text:"拜访花宗。",hideIf:"visited_huazong",next:"huazong_1"},{text:"去蛇人族旧址找美杜莎。",hideIf:"visited_medusa",next:"medusa_route"},{text:"去中州拍卖行看看。",next:"auction_house"},{text:"直捣魂殿分殿。",tag:"danger",next:"soul_hall"}]},
auction_house:{title:"中州拍卖行",noRandom:true,isAuction:true,text:`拍卖行里人声鼎沸。高台上，拍卖师正唾沫横飞地介绍今天的拍品。\n\n三件物品摆在玉盘上。你可以竞拍、一口价，或者把背包里的东西卖掉。\n\n（竞拍：支付起拍价，约35%概率被别人抬走；一口价：支付1.4倍价格，必得。）`,choices:[]},
auction_lose:{title:"竞拍失败",noRandom:true,text:`你刚报出价格，旁边就有人抬了价。几轮下来，那件东西被别人拍走了。\n\n你悻悻地坐下，有点不甘心。`,choices:[{text:"算了，看看别的。",next:"auction_house"},{text:"去别处逛逛。",next:"zhongzhou_hub"}]},
sell_items:{title:"出售物品",noRandom:true,isSell:true,text:`拍卖行后堂，掌柜眯着眼打量你：“卖东西？拿出来看看。”\n\n你打开背包，把能卖的都摆上桌。`,choices:[]},
dan_tower:{title:"丹塔",text:`丹塔考核持续了三天。你以焚诀炼出的丹药品质惊人，一路杀进决赛。\n\n最终，你拿到一枚炼药师徽章。虽然只是最低等级，但这枚徽章意味着：从今往后，中州很多地方，你可以横着走。`,choices:[{text:"买些丹药补给，再回客栈。",next:"zhongzhou_hub",fx:{day:30,exp:400,gold:-300,item:["三纹青灵丹","复伤丹"],flag:{alchemist:true,visited_danta:true}}}]},
huazong_1:{title:"花宗 · 山门",text:`花宗坐落在一片花海之中。山门前，两名女弟子拦住你：“花宗不接待男客。”\n\n你正要解释，山门内传来一个熟悉的声音：“让他进来。”\n\n云韵站在花径尽头，穿着一身素白长裙，比在云岚宗时更安静。她看着你：“我猜到你会来。”`,choices:[{text:"直接问：花宗和魂殿，是什么关系？",tag:"danger",risk:.35,failNext:"huazong_2",failFx:{rel:{yunyun:-10}},next:"huazong_2"},{text:"先叙旧，再谈正事。",next:"huazong_2",fx:{rel:{yunyun:10}}}]},
huazong_2:{title:"花宗 · 花海",text:`云韵带你穿过花海。她说，花宗上一任宗主死于魂殿之手，她接任不久，根基不稳。\n\n“我需要一个能打的盟友。”她停下脚步，看着你，“你需要在花宗落脚。我们各取所需。”`,choices:[{text:"答应结盟，并帮她清理宗内魂殿暗线。",tag:"danger",risk:.35,failNext:"huazong_fail",next:"huazong_3",fx:{exp:500,rel:{yunyun:15}}},{text:"婉拒，只求一份花宗的情报。",next:"zhongzhou_hub",fx:{day:20,exp:200,rel:{yunyun:5},flag:{visited_huazong:true}}}]},
huazong_fail:{title:"暗线反扑",text:`你低估了魂殿埋在花宗的暗线。三名斗灵级杀手在夜里同时出手，你拼死突围，身上多了七道伤口。\n\n云韵赶到时，战斗已经结束。她看着你，眼神复杂：“是我大意了。”`,choices:[{text:"养伤，再回客栈。",next:"zhongzhou_hub",fx:{hp:-50,day:30,exp:300,rel:{yunyun:10},flag:{visited_huazong:true}}}]},
huazong_3:{title:"花宗 · 盟约",text:`你帮云韵拔掉了魂殿的暗线。最后一战，她亲手斩杀了那名潜伏十年的长老。\n\n战后，她站在花海中央，很久没说话。最后转过身，把一枚花宗信物递给你：“拿着。以后花宗的门，随时为你开。”`,choices:[{text:"收下信物，回客栈。",next:"zhongzhou_hub",fx:{day:40,exp:600,rel:{yunyun:20},item:"复伤丹",flag:{visited_huazong:true,huazong_ally:true}}}]},
medusa_route:{title:"女王",text:`蛇人族旧址，黄沙漫天。美杜莎站在废墟中央，紫发被风吹得散乱。\n\n“你还敢来。”她冷笑。\n\n“我需要一个盟友。”你说。\n\n她盯着你看了很久，忽然笑了：“有意思。人类，你胆子不小。”`,choices:[{text:"与她结盟，共同对付魂殿。",tag:"danger",risk:.2,failNext:"medusa_fail",next:"zhongzhou_hub",fx:{rel:{medusa:20},exp:300,flag:{medusa_ally:true,visited_medusa:true}}},{text:"只求她提供魂殿的情报。",next:"zhongzhou_hub",fx:{day:20,exp:200,rel:{medusa:5},flag:{visited_medusa:true}}}]},
medusa_fail:{title:"蛇威",text:`你话没说完，美杜莎的手已经掐住了你的喉咙。斗皇的气息压得你几乎窒息。\n\n“人类，”她声音很轻，“别以为说几句好听的，就能让我替你卖命。”\n\n她松开手，你跌坐在地。`,choices:[{text:"狼狈离开。",next:"zhongzhou_hub",fx:{hp:-30,day:10,exp:100,flag:{visited_medusa:true}}}]},
soul_hall:{title:"魂殿",text:`魂殿的分殿藏在一片荒原之下。你站在入口前，能感觉到里面传出的阴冷气息。\n\n药老的声音很轻：“韩枫当年，就是被他们带走的。”\n\n你握紧拳头。这一战，躲不掉。`,choices:[{text:"直接杀进去。",tag:"danger",risk:.5,failNext:"dead_end",next:"final_battle",fx:{exp:800}},{text:"先在外围布局，逐个击破。",next:"final_battle",fx:{day:90,exp:600,flag:{prepared:true}}}]},
final_battle:{title:"决战",text:`魂殿分殿崩塌，黑雾冲天。你站在废墟中央，对面是魂殿的护法，斗宗巅峰。\n\n“一个小辈，也敢闯魂殿？”他冷笑。\n\n你抬头看他，缓缓抬起手。掌心里，异火翻涌。\n\n药老在你脑海里说：“活着回来。”`,choices:[{text:"全力爆发，以异火焚尽一切。",tag:"danger",risk:.35,failNext:"dead_end",next:"ending_router",fx:{exp:2000}},{text:"稳守反击，寻找破绽。",tag:"danger",risk:.5,failNext:"dead_end",next:"ending_router",fx:{exp:1500,hp:-30}}]},
ending_router:{title:"",text:"",noRandom:true,choices:[]},
ending_emperor:{title:"结局 · 炎帝",noRandom:true,text:`火焰冲天而起，魂殿护法在惨叫声中化为灰烬。\n\n你站在废墟上，衣袍猎猎。药老的声音带着笑意：“小娃娃……不，现在该叫你一声炎帝了。”\n\n多年后，斗气大陆流传着一个名字。有人说他是穿越者，有人说他是天命所归，也有人说他不过是运气好。\n\n只有你自己知道，这一路走来，每一次选择，都可能是最后一次。`,choices:[{text:"—— 重开一局 ——",next:"restart_game",tag:"gold"}]},
ending_medusa:{title:"结局 · 蛇族之盟",noRandom:true,text:`魂殿分殿崩塌的那一夜，美杜莎带着蛇人族战士赶到。她看着废墟中的你，挑了挑眉：“还算没死。”\n\n你笑：“让你失望了。”\n\n后来，蛇人族与人类第一次真正结盟。只有你知道，沙漠里的风很烈，她的脾气更烈。但并肩站着的时候，谁也没再提当年石殿里的那句“想怎么死”。`,choices:[{text:"—— 重开一局 ——",next:"restart_game",tag:"gold"}]},
ending_healer:{title:"结局 · 悬壶",noRandom:true,text:`魂殿事了，你把异火收入体内，却没有再往前争。\n\n小医仙在山谷里开了间药庐，你偶尔去帮忙。她总嫌你炼药火候太猛，你总笑她草药放得太抠。\n\n有一天她问你：“你不去争那个位置了？”\n\n你说：“争过了。现在想歇歇。”`,choices:[{text:"—— 重开一局 ——",next:"restart_game",tag:"gold"}]},
ending_gu:{title:"结局 · 古族之约",noRandom:true,text:`古族界门再次打开时，薰儿站在门口，还是那身淡青长裙。\n\n“萧炎哥哥，回家了。”她说。\n\n古族的长老们不再用刀一样的目光看你。你走进古界，身后的中州渐渐远去。`,choices:[{text:"—— 重开一局 ——",next:"restart_game",tag:"gold"}]},
ending_alchemist:{title:"结局 · 丹道之巅",noRandom:true,text:`你没有去争斗帝之位。魂殿事了之后，你把全部心思放在了丹炉上。\n\n丹塔的排名一年一变，你的名字从末位一路往上爬。最后一场丹会，你炼出一枚九品丹药，满城飘香。\n\n有人问你为什么不争天下。你笑了笑，指了指丹炉：“这里就是我的天下。”`,choices:[{text:"—— 重开一局 ——",next:"restart_game",tag:"gold"}]},
dead_end:{title:"结局 · 身死道消",noRandom:true,text:`眼前一黑，意识像被扯碎的纸，散进无边黑暗。\n\n你最后听见的，是药老一声很轻的叹息。\n\n【你死了。】\n【这一世的修行，到此为止。】`,choices:[{text:"重开一局",next:"restart_game",tag:"danger"}]},
ev_qi_deviation:{title:"突发事件 · 走火入魔",text:`修炼到一半，斗之气忽然逆冲经脉。你眼前发黑，耳边嗡嗡作响。\n\n药老急喝：“稳住！别硬压，顺着它走！”`,choices:[{text:"咬牙硬压。",tag:"danger",risk:.45,failNext:"ev_qi_deviation_fail",next:"__return__",fx:{exp:200,hp:-15}},{text:"顺其自然，缓缓引导。",next:"__return__",fx:{exp:60,hp:-5}}]},
ev_qi_deviation_fail:{title:"经脉逆冲",text:`你压不住那股逆冲的斗之气，一口血喷出来，经脉像被针扎。\n\n好在药老出手护住了心脉。你瘫在地上，半天爬不起来。`,choices:[{text:"缓一缓，继续。",next:"__return__",fx:{hp:-25,exp:80}}]},
ev_bandit:{title:"突发事件 · 劫道",text:`山路偏僻，三名斗者拦住了你：“把值钱的东西留下。”\n\n为首那个舔了舔嘴唇，看你的眼神像看一只肥羊。`,choices:[{text:"打。",tag:"danger",risk:.3,failNext:"ev_bandit_fail",next:"__return__",fx:{exp:150,gold:120}},{text:"给钱，破财免灾。",next:"__return__",fx:{gold:-100}},{text:"跑。",tag:"danger",risk:.25,failNext:"ev_bandit_fail",next:"__return__",fx:{exp:50}}]},
ev_bandit_fail:{title:"刀口舔血",text:`你低估了对方。混战中你被砍中肩膀，鲜血直流。最后是靠药老暗中出手，才把三人吓退。`,choices:[{text:"包扎伤口，继续赶路。",next:"__return__",fx:{hp:-30,exp:100}}]},
ev_cave:{title:"突发事件 · 山洞奇遇",text:`避雨时你钻进一个山洞，发现角落里有一具白骨，白骨旁边放着一只木匣。\n\n木匣没有上锁。`,choices:[{text:"打开看看。",tag:"danger",risk:.25,failNext:"ev_cave_fail",next:"__return__",fx:{exp:250,item:"裂风掌"}},{text:"不动，退出山洞。",next:"__return__",fx:{exp:30}}]},
ev_cave_fail:{title:"匣中之毒",text:`木匣打开的瞬间，一股黑烟喷出。你屏住呼吸已经来不及，毒气钻进鼻腔，眼前一阵阵发黑。`,choices:[{text:"运功逼毒。",next:"__return__",fx:{hp:-35,exp:80}}]},
ev_insight:{title:"突发事件 · 顿悟",text:`夜里打坐，你忽然想起原著里的一段功法注解，与此刻体内的斗气运转隐隐相合。\n\n灵光一闪，经脉里仿佛有什么东西被捅开了。`,choices:[{text:"顺着这股感觉走。",next:"__return__",fx:{exp:180}}]},
ev_meet_xuner:{title:"突发事件 · 偶遇薰儿",text:`街上人潮涌动，你一眼就看见了萧薰儿。\n\n她也看见了你，走过来，笑得很轻：“萧炎哥哥，好巧。”`,choices:[{text:"陪她走走。",next:"__return__",fx:{rel:{xuner:8},exp:60}},{text:"借口有事，先走。",next:"__return__",fx:{exp:80}}]},
ev_meet_xiaoyixian:{title:"突发事件 · 药香",text:`路过一间药铺，你闻到了一股熟悉的药香。\n\n小医仙正低头称药，抬头看见你，愣了一下，然后笑了：“好久不见。”`,choices:[{text:"进去坐坐。",next:"__return__",fx:{rel:{xiaoyixian:8},exp:60}},{text:"在门口打个招呼就走。",next:"__return__",fx:{exp:50}}]}
};
function render(){const lv=levelOf();document.getElementById("status").innerHTML=`<div>年龄：<b>${ageOf()}岁</b></div><div>穿越：<b>第${state.day}天</b></div><div>修为：<b>${realmName(lv)}</b></div><div>气血：<b class="${state.hp<40?'dead':''}">${state.hp}/100</b></div><div>金币：<b>${state.gold}</b></div><div>境界：<b>${lv}/98</b></div>`;document.getElementById("expbar").style.width=Math.min(100,(state.exp%EXP_PER)/EXP_PER*100)+"%";const rs=Object.keys(state.rel).filter(k=>state.rel[k]>0).map(k=>`<span>${relName(k)} ${state.rel[k]}</span>`).join("");document.getElementById("rels").innerHTML=rs||"尚无羁绊";renderItems();const base=N[state.nodeId]||N.start;let node=base;if(base.isAuction)node=Object.assign({},base,{choices:buildAuctionChoices()});if(base.isSell)node=Object.assign({},base,{choices:buildSellChoices()});const p=PORTRAITS[PORTRAIT_MAP[state.nodeId]];let ph="";if(p)ph=`<div class="portrait"><div class="avatar" style="background:linear-gradient(135deg,${p.c1},${p.c2})">${p.g}</div><div><div class="pname">${p.name}</div><div class="prole">${p.role}</div></div></div>`;document.getElementById("story").innerHTML=ph+(node.title?`<div class="title-tag">${node.title}</div>\n`:"")+node.text+(state.lastDelta?`<div class="delta">${state.lastDelta}</div>`:"");const box=document.getElementById("choices");box.innerHTML="";node.choices.filter(ch=>!(ch.hideIf&&state.flags[ch.hideIf])).forEach(ch=>{const b=document.createElement("button");b.className="main"+(ch.tag?" "+ch.tag:"");b.innerHTML=ch.text+(ch.hint?`<small>${ch.hint}</small>`:"");b.onclick=()=>choose(ch);box.appendChild(b)});window.scrollTo({top:0,behavior:"smooth"})}
function renderItems(){const box=document.getElementById("items"),names=Object.keys(state.items).filter(n=>state.items[n]>0);if(!names.length){box.style.display="none";box.innerHTML="";return}box.style.display="flex";box.innerHTML=names.map(n=>{const def=ITEM_DEF[n],tip=def?def.desc:"";return`<button class="chip" title="${tip}" onclick="useItem('${n}')">${n} ×${state.items[n]}</button>`}).join("")}
function buildAuctionChoices(){if(!state.auction.length)refreshAuction();const out=[];state.auction.forEach((it,i)=>{const one=Math.round(it.price*1.4);out.push({text:`竞拍【${it.name}】`,hint:`起拍 ${it.price} 金币，约35%概率被抢`,risk:.35,failNext:"auction_lose",fx:{gold:-it.price,item:it.name},auctionIndex:i});out.push({text:`一口价【${it.name}】`,hint:`支付 ${one} 金币，必得`,tag:"safe",fx:{gold:-one,item:it.name},auctionIndex:i})});out.push({text:"出售物品",hint:"把背包里的东西换成金币",next:"sell_items"},{text:"离开拍卖行",hint:"回中州",next:"zhongzhou_hub",tag:"safe"});return out}
function buildSellChoices(){const out=[];Object.keys(state.items).forEach(name=>{if(state.items[name]<=0)return;const def=ITEM_DEF[name],price=def&&def.sell?def.sell:50;out.push({text:`出售【${name}】×1`,hint:`获得 ${price} 金币`,fx:{gold:price},sellItem:name})});if(!out.length)out.push({text:"背包空空如也",next:"auction_house"});else out.push({text:"返回拍卖行",next:"auction_house",tag:"safe"});return out}
function useItem(name){const def=ITEM_DEF[name];if(!def){toast("这个物品暂时用不了");return}if((state.items[name]||0)<=0)return;const old=levelOf();state.items[name]--;if(state.items[name]<=0)delete state.items[name];const ch=applyFx(def.effect);if(def.flag){for(const k in def.flag)state.flags[k]=def.flag[k]}if(levelOf()>old)SFX.levelup();else SFX.success();toast("使用了 "+name+(ch.length?"："+ch.join("　"):""));checkAchievements();render()}
function choose(ch){if(ch.next==="restart_game"){restart();return}if(state.dead)return;SFX.click();if(ch.fx&&ch.fx.gold&&ch.fx.gold<0){const need=-ch.fx.gold;if(state.gold<need){SFX.fail();toast("金币不足，需要 "+need+"，你只有 "+state.gold);return}}let ok=true;if(typeof ch.risk==="number"&&Math.random()<ch.risk)ok=false;const target=ok?ch.next:(ch.failNext||ch.next),fx=ok?(ch.fx||{}):(ch.failFx||{});const old=levelOf();const changes=applyFx(fx);if(typeof ch.auctionIndex==="number"){if(ok)SFX.gold();state.auction.splice(ch.auctionIndex,1);if(!state.auction.length)refreshAuction()}if(ch.sellItem){if((state.items[ch.sellItem]||0)>0){state.items[ch.sellItem]--;if(state.items[ch.sellItem]<=0)delete state.items[ch.sellItem]}SFX.gold()}state.history.push(ch.text.slice(0,18));state.lastDelta=changes.length?"<em>变化：</em>"+changes.join("　"):"";if(levelOf()>old)SFX.levelup();if(target==="__return__"){state.nodeId=state.pendingNext||"zhongzhou_hub";state.pendingNext=null;checkAchievements();render();return}if(target==="ending_router"){state.nodeId=calcEnding();checkAchievements();render();return}if(state.hp<=0||target==="dead_end"){state.dead=true;state.nodeId="dead_end";state.lastDelta="<em>死亡。</em> 这一世结束。";SFX.death();checkAchievements();render();return}if(!ok)SFX.fail();const node=N[target];const canRandom=node&&!node.noRandom&&!state.pendingNext&&target!=="ending_router"&&!node.isAuction&&!node.isSell;if(canRandom&&Math.random()<.2){state.pendingNext=target;state.nodeId=pickEvent()}else state.nodeId=target;checkAchievements();render()}
function openAchv(){SFX.init();const list=document.getElementById("achvList"),un=Object.keys(state.achievements).length;document.getElementById("achvCount").textContent=un+"/"+ACHIEVEMENTS.length;list.innerHTML=ACHIEVEMENTS.map(a=>{const d=!!state.achievements[a.id];return`<div class="achv-item ${d?"":"locked"}"><span class="adone">${d?"已达成":""}</span><div class="aname">${d?"🏆 ":""}${a.name}</div><div class="adesc">${a.desc}</div></div>`}).join("");document.getElementById("achvOverlay").classList.add("show")}
function closeAchv(){document.getElementById("achvOverlay").classList.remove("show")}
function toggleSound(){state.sound=!state.sound;const b=document.getElementById("soundBtn");b.textContent=state.sound?"音效":"静音";b.classList.toggle("off",!state.sound);if(state.sound){SFX.init();SFX.click()}toast(state.sound?"音效已开启":"音效已关闭")}
function saveGame(){localStorage.setItem(SAVE_KEY,JSON.stringify(state));toast("已保存")}
function loadGame(){const raw=localStorage.getItem(SAVE_KEY);if(!raw){toast("没有存档");return}Object.assign(state,JSON.parse(raw));if(!state.auction)state.auction=[];if(!state.achievements)state.achievements={};const b=document.getElementById("soundBtn");b.textContent=state.sound?"音效":"静音";b.classList.toggle("off",!state.sound);render();toast("已读取")}
function restart(){if(!confirm("确定重开？当前进度会丢失。"))return;Object.assign(state,{day:1,exp:240,gold:200,hp:100,rel:{xuner:0,xiaoyixian:0,medusa:0,yunyun:0,nalan:0,yafei:0},flags:{},items:{},history:[],achievements:{},auction:[],nodeId:"start",dead:false,pendingNext:null,lastDelta:"",sound:state.sound});render()}
render();if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));document.addEventListener("touchstart",()=>SFX.init(),{once:true});document.addEventListener("click",()=>SFX.init(),{once:true});
</script>
</body>
</html>
